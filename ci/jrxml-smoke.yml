# PARKED, DELIBERATELY -- this file is outside .github/workflows/ so GitHub does not
# run it. Audit L6 recorded that as a defect; it is a decision, and the reason belongs
# here rather than in an audit nobody reads next to the file.
#
# The job needs ORACLE_DSN and JRS_URL pointing at a client Oracle instance and a
# Jaspersoft server, both of which sit inside a private VCN. A GitHub-hosted runner
# cannot reach either, so moving this into .github/workflows/ would not gain coverage --
# it would fail on every push touching a .jrxml or .sql file and make CI permanently
# red, which costs more than the check is worth.
#
# TO ACTIVATE, one of:
#   * a self-hosted runner inside the VCN -- then move this file to .github/workflows/
#     and set runs-on to that runner, and
#   * the eleven secrets below configured on the repository.
# Until then it is runnable by hand with `act`, or as the manual workflow_dispatch it
# already declares, from somewhere with VPN.
name: jrxml-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "reports/**/*.jrxml"
      - "sql/**/*.sql"
      - "server/input_controls/*.json"
      - "ci/jrxml-smoke.yml"

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    env:
      JRS_URL: ${{ secrets.JRS_URL }}
      JRS_USER: ${{ secrets.JRS_USER }}
      JRS_PASSWORD: ${{ secrets.JRS_PASSWORD }}
      JRS_REPORT_URI: ${{ secrets.JRS_REPORT_URI }}
      SMOKE_CLIENT_ID: ${{ secrets.SMOKE_CLIENT_ID }}
      SMOKE_START_TS: ${{ secrets.SMOKE_START_TS }}
      SMOKE_END_TS: ${{ secrets.SMOKE_END_TS }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
      ORACLE_CLIENT_LIB_DIR: ${{ secrets.ORACLE_CLIENT_LIB_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy scripts executable
        run: |
          chmod +x deploy/build_report_unit.sh
          chmod +x deploy/build_report_unit_scorecard.sh
          chmod +x deploy/build_report_unit_collections.sh
          chmod +x deploy/build_report_unit_ops_hub.sh
          chmod +x deploy/build_report_unit_map.sh
          chmod +x deploy/build_report_unit_billing_statement.sh
          chmod +x deploy/deploy_jasper.sh
          chmod +x deploy/batch_export_pdf.sh

      - name: XML lint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout reports/billing_master.jrxml
          xmllint --noout reports/subreports/line_items.jrxml
          xmllint --noout reports/client_value_scorecard.jrxml
          xmllint --noout reports/collections_prioritization.jrxml
          xmllint --noout reports/ops_hub_dashboard.jrxml
          xmllint --noout reports/lookup_description_completeness_audit.jrxml
          xmllint --noout reports/map_meters_coverage.jrxml
          xmllint --noout reports/billing_customer_statement.jrxml
          xmllint --noout reports/subreports/line_items_fieldwork.jrxml

      - name: Compile JRXML with JasperStarter (containerized)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/billing_master.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/subreports/line_items.jrxml -o reports/subreports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/client_value_scorecard.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/collections_prioritization.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/ops_hub_dashboard.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/lookup_description_completeness_audit.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/map_meters_coverage.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/billing_customer_statement.jrxml -o reports
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/akingde/jasperstarter:3.7.0 \
            cp reports/subreports/line_items_fieldwork.jrxml -o reports/subreports

      - name: Build report unit bundle zips
        run: |
          ./deploy/build_report_unit.sh
          ./deploy/build_report_unit_scorecard.sh
          ./deploy/build_report_unit_collections.sh
          ./deploy/build_report_unit_ops_hub.sh
          pwsh -File deploy/build_report_unit_lookup_audit.ps1
          ./deploy/build_report_unit_map.sh
          ./deploy/build_report_unit_billing_statement.sh
          test -s deploy/billing_master_report_unit.zip
          test -s deploy/billing_customer_statement_report_unit.zip
          test -s deploy/client_value_scorecard_report_unit.zip
          test -s deploy/collections_prioritization_report_unit.zip
          test -s deploy/ops_hub_dashboard_report_unit.zip
          test -s deploy/lookup_description_completeness_audit_report_unit.zip
          test -s deploy/map_meters_coverage_report_unit.zip

      - name: Source-of-truth SQL validation
        run: |
          python scripts/validate_source_of_truth_sql.py \
            sql/smartcity_9_workstream_kpis.sql \
            sql/client_value_scorecard.sql \
            sql/collections_prioritization.sql \
            sql/customer_contact_readiness_kpi.sql

      - name: Read-only SQL guard (validation packs)
        run: |
          python scripts/repo/sql_read_only_guard.py \
            sql/performance/billed_usage/validation \
            sql/diagnostics/cisadm_dictionary

      - name: Build CD Field Inventory
        run: |
          python scripts/build_cd_field_inventory.py

      - name: Report Lookup Coverage Gate
        run: |
          python scripts/check_report_lookup_coverage.py

      - name: Read-only Oracle validation + completeness gate
        if: ${{ env.ORACLE_USER != '' && env.ORACLE_PASSWORD != '' && env.ORACLE_DSN != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt
          python -m pipeline.validate_tables
          python scripts/check_config_completeness_gate.py output/config_completeness.json

      - name: Smoke render PDF via JasperReports Server REST v2
        if: ${{ env.JRS_URL != '' && env.JRS_USER != '' && env.JRS_PASSWORD != '' && env.JRS_REPORT_URI != '' }}
        run: |
          curl -sS -u "${JRS_USER}:${JRS_PASSWORD}" \
            "${JRS_URL}/rest_v2/reports/${JRS_REPORT_URI}.pdf?CLIENT_ID=${SMOKE_CLIENT_ID}&START_TS=${SMOKE_START_TS}&END_TS=${SMOKE_END_TS}" \
            -o smoke_report.pdf
          test -s smoke_report.pdf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jasper-build-artifacts
          path: |
            reports/billing_master.jasper
            reports/subreports/line_items.jasper
            reports/client_value_scorecard.jasper
            reports/collections_prioritization.jasper
            reports/ops_hub_dashboard.jasper
            reports/lookup_description_completeness_audit.jasper
            reports/map_meters_coverage.jasper
            reports/billing_customer_statement.jasper
            reports/subreports/line_items_fieldwork.jasper
            deploy/billing_master_report_unit.zip
            deploy/billing_customer_statement_report_unit.zip
            deploy/client_value_scorecard_report_unit.zip
            deploy/collections_prioritization_report_unit.zip
            deploy/ops_hub_dashboard_report_unit.zip
            deploy/map_meters_coverage_report_unit.zip
            deploy/lookup_description_completeness_audit_report_unit.zip
            smoke_report.pdf
          if-no-files-found: warn
